databases:
  - name: honeypot-db
    plan: free

services:
  - type: web
    name: honeypot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 2 --threads 4 --timeout 30 --bind 0.0.0.0:$PORT
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: honeypot-db
          property: connectionString
      - key: DASHBOARD_PASSWORD
        sync: false
      - key: PYTHON_VERSION
        value: 3.12.7
